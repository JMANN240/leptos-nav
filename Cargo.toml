[package]
name = "leptos_nav"
description = "Leptos utilities for making navigation menus"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
leptos = "0.8.21"
leptos_router = "0.8.16"

[features]
csr = [
    "leptos/csr",
]
hydrate = [
    "leptos/hydrate",
]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
]
